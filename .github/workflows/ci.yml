name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install unit-test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  integration-tests:
    name: Incremental pipeline (Spark / Delta)
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-streaming.txt

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Spark dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-streaming.txt
          .venv/bin/python -m pip check

      - name: Run synthetic incremental pipeline
        env:
          BANKING_SPARK_APP: tests/integration/pipeline_check.py
        run: bash scripts/bronze.sh

      - name: Run CSV resume and interruption scenario
        env:
          BANKING_SPARK_APP: tests/integration/replay_resume_check.py
        run: bash scripts/bronze.sh

      - name: Run verified export import scenario
        env:
          BANKING_SPARK_APP: tests/integration/import_star_check.py
        run: bash scripts/bronze.sh

  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Terraform 1.17.1
        env:
          TERRAFORM_SHA256: 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061
        run: |
          curl --fail --silent --show-error --location --retry 3 https://releases.hashicorp.com/terraform/1.17.1/terraform_1.17.1_linux_amd64.zip --output "$RUNNER_TEMP/terraform.zip"
          echo "$TERRAFORM_SHA256  $RUNNER_TEMP/terraform.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure/aws

      - name: Validate bootstrap and adoption without AWS credentials
        run: |
          for directory in infrastructure/aws/bootstrap infrastructure/aws; do
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate
          done
